<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxe Admin</title>
<style>
:root{--bg:#f6f4f7;--card:#fff;--ink:#1d1a24;--mute:#6b6676;--line:#e4e0ea;--accent:#5b2a86;--accent-ink:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#14111a;--card:#1e1a27;--ink:#f1eef6;--mute:#a49eb3;--line:#322c3f;--accent:#b48be0;--accent-ink:#14111a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:6px 0 14px}h2{font-size:19px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:10px;padding:11px 14px;border:1px solid var(--accent);margin-top:12px;background:transparent;color:var(--accent)}
button.p{background:var(--accent);color:var(--accent-ink);width:100%}
button.d{border-color:var(--err);color:var(--err)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{display:flex;gap:12px;border-top:1px solid var(--line);padding:12px 0}
.item img{width:70px;height:70px;object-fit:cover;border-radius:8px;background:var(--line)}
.ph{width:70px;height:70px;border-radius:8px;background:var(--line)}
.meta{color:var(--mute);font-size:14px}
.tabs button{margin:0 6px 8px 0}.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.msg{min-height:20px;font-size:14px;margin-top:8px;color:var(--mute)}
.hidden{display:none}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:13px;margin:4px 4px 0 0;cursor:pointer}
.b{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--line);overflow-wrap:anywhere}.b.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.dot{color:#e5484d}
</style>
</head>
<body>
<div class="wrap">
<h1>Admin</h1>
<div id="gate" class="card">Checking access…</div>

<div id="app" class="hidden">
  <div class="tabs" id="nav" style="margin-bottom:14px">
    <button data-s="items" class="on">Items</button>
    <button data-s="chats">Chats <span class="dot hidden" id="dot-chats">●</span></button>
    <button data-s="orders">Orders <span class="dot hidden" id="dot-orders">●</span></button>
    <button data-s="forms">Forms <span class="dot hidden" id="dot-forms">●</span></button>
    <button data-s="of">OF page</button>
  </div>
  <div id="sec-items">
  <div class="card">
    <h2 id="formTitle">Add item</h2>
    <label for="cat">Catalogue</label>
    <select id="cat"><option>CORE</option><option>PRIME</option></select>
    <label for="photo">Photo (optional)</label>
    <input id="photo" type="file" accept="image/*">
    <label for="caption">Caption (optional)</label>
    <textarea id="caption"></textarea>
    <div class="row">
      <div><label for="duration">Duration</label><input id="duration" placeholder="2h 10m"></div>
      <div><label for="size">Size</label><input id="size" placeholder="2.48 GB"></div>
      <div><label for="price">Price</label><input id="price" placeholder="99"></div>
    </div>
    <label for="cats">Categories (comma separated)</label>
    <input id="cats" placeholder="western, action">
    <div class="chips" id="chips"></div>
    <label for="plink">Private link (only you can see it)</label>
    <input id="plink" type="url" placeholder="https://...">
    <div class="msg" id="msg"></div>
    <button class="p" id="save">Save item</button>
    <button id="cancel" class="hidden">Cancel edit</button>
  </div>

  <div class="card">
    <h2>Items</h2>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>
  </div><div id="sec-chats" class="hidden">
  <div class="card"><h2>Support chats</h2>
    <div id="chatList"></div>
    <div id="chatThread" class="hidden">
      <button id="chatBack">Back to chats</button> <button class="d" id="chatDel">Delete chat</button> <strong id="chatWho"></strong>
      <div id="chatMsgs" style="display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;margin:12px 0"></div>
      <input id="chatIn" placeholder="Write a reply" maxlength="1000">
      <button class="p" id="chatSend">Send reply</button>
    </div>
  </div>
  </div><div id="sec-orders" class="hidden">
  <div class="card"><h2>Orders</h2><button id="refO">Refresh</button><div id="orders"></div></div>
  </div><div id="sec-forms" class="hidden">
  <div class="card"><h2>Forms</h2><div id="forms"></div></div>
  </div><div id="sec-of" class="hidden">
  <div class="card"><h2>OF page</h2>
    <label for="ofText">Page text</label>
    <textarea id="ofText" style="min-height:200px"></textarea>
    <label for="ofUnlockLabel">First button label</label>
    <input id="ofUnlockLabel">
    <label for="ofUnlockUrl">First button link</label>
    <input id="ofUnlockUrl" type="url" placeholder="https://...">
    <label for="ofSupportLabel">Support button label</label>
    <input id="ofSupportLabel">
    <div class="msg" id="ofMsg"></div>
    <button class="p" id="ofSave">Save OF page</button>
  </div>
  </div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, setDoc, deleteDoc, doc, getDoc, getDocs, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN_EMAIL = "daemonhotd67@gmail.com";
const CLOUD_NAME = "nl17lif3";
const UPLOAD_PRESET = "luxe_unsigned";

const app = initializeApp({
  apiKey: "AIzaSyB2MXcsqdk7tMrILWHMPiuBXADA1NLLqYY",
  authDomain: "luxe-5be48.firebaseapp.com",
  projectId: "luxe-5be48",
  storageBucket: "luxe-5be48.firebasestorage.app",
  messagingSenderId: "285202599477",
  appId: "1:285202599477:web:02efbc6d056a91907e2b7c"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let items = [], editing = null, tab = "OF", hiddenCats = [];
async function saveHidden(){ await setDoc(doc(db, "settings", "adminChips"), { hidden: hiddenCats }).catch(() => {}); }

onAuthStateChanged(auth, async u => {
  if (!u) { $("gate").innerHTML = 'Log in first on the <a href="/">main site</a>, then come back here.'; return; }
  if (u.email !== ADMIN_EMAIL) { $("gate").textContent = "This account is not the admin."; return; }
  $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
  await load();
  loadExtra();
  startChats();
  loadOF();
  onSnapshot(collection(db, "orders"), () => loadExtra());
  onSnapshot(collection(db, "forms"), () => loadExtra());
});

async function load(){
  const snap = await getDocs(collection(db, "items"));
  items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds ?? 9e12) - (a.createdAt?.seconds ?? 9e12));
  try { const h = await getDoc(doc(db, "settings", "adminChips")); hiddenCats = h.exists() ? (h.data().hidden || []) : []; } catch (e) {}
  render();
}

function render(){
  $("tabs").innerHTML = ["OF","CORE","PRIME"].map(c => `<button class="${c===tab?'on':''}" data-t="${c}">${c}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  const list = items.filter(i => i.catalogue === tab);
  $("list").innerHTML = list.length ? "" : '<div class="meta">No items here yet.</div>';
  list.forEach(i => {
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = (i.photoUrl ? `<img src="${i.photoUrl}" alt="">` : '<div class="ph"></div>') +
      `<div style="flex:1"><div>${esc(i.caption || "(no caption)").slice(0,80)}</div>
       <div class="meta">${esc(i.duration)} · ${esc(i.size)} · ${esc(i.price)}</div>
       <div class="meta">${(i.categories||[]).map(esc).join(", ")}</div>
       <button data-e>Edit</button> <button class="d" data-d>Delete</button></div>`;
    el.querySelector("[data-e]").onclick = () => startEdit(i);
    el.querySelector("[data-d]").onclick = async () => { if (confirm("Delete this item?")) { await deleteDoc(doc(db,"items",i.id)); await deleteDoc(doc(db,"itemLinks",i.id)).catch(() => {}); await load(); } };
    $("list").appendChild(el);
  });
  const all = [...new Set(items.flatMap(i => i.categories || []))].filter(c => !hiddenCats.includes(c));
  $("chips").innerHTML = all.map(c => `<span data-c="${esc(c)}">${esc(c)} <b data-x title="Remove from this list (items keep it)" style="color:var(--err)">×</b></span>`).join("");
  $("chips").querySelectorAll("span").forEach(sp => sp.onclick = async e => {
    const c = sp.dataset.c;
    if (e.target.dataset.x !== undefined) { hiddenCats = hiddenCats.concat(c); await saveHidden(); render(); return; }
    const cur = $("cats").value.split(",").map(x => x.trim()).filter(Boolean);
    if (!cur.map(x => x.toLowerCase()).includes(c.toLowerCase())) cur.push(c);
    $("cats").value = cur.join(", ");
  });
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function startEdit(i){
  editing = i;
  $("formTitle").textContent = "Edit item";
  $("cat").value = i.catalogue; $("caption").value = i.caption || "";
  $("duration").value = i.duration; $("size").value = i.size; $("price").value = i.price;
  $("cats").value = (i.categories || []).join(", ");
  $("plink").value = "";
  getDoc(doc(db, "itemLinks", i.id)).then(x => { if (x.exists()) $("plink").value = x.data().link || ""; }).catch(() => {});
  $("cancel").classList.remove("hidden");
  $("msg").textContent = "Leave the photo empty to keep the current one.";
  scrollTo({ top: 0, behavior: "smooth" });
}
function reset(){
  editing = null; $("formTitle").textContent = "Add item";
  ["caption","duration","size","price","cats","plink"].forEach(k => $(k).value = "");
  $("photo").value = ""; $("cancel").classList.add("hidden"); $("msg").textContent = "";
}
$("cancel").onclick = reset;

async function upload(file){
  const fd = new FormData(); fd.append("file", file); fd.append("upload_preset", UPLOAD_PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
  const j = await r.json();
  if (!j.secure_url) throw new Error(j.error?.message || "Photo upload failed");
  return j.secure_url;
}

$("save").onclick = async () => {
  const msg = $("msg"); msg.textContent = "";
  const duration = $("duration").value.trim(), size = $("size").value.trim(), price = $("price").value.trim();
  if (!duration || !size || !price) { msg.textContent = "Duration, size and price are required."; return; }
  const categories = [...new Set($("cats").value.split(",").map(x => x.trim().toLowerCase()).filter(Boolean))];
  $("save").disabled = true; msg.textContent = "Saving…";
  try {
    let photoUrl = editing?.photoUrl || "";
    const f = $("photo").files[0];
    if (f) photoUrl = await upload(f);
    const data = { catalogue: $("cat").value, caption: $("caption").value.trim(), duration, size, price, categories, photoUrl };
    let itemId;
    if (editing) { itemId = editing.id; await setDoc(doc(db, "items", itemId), data, { merge: true }); }
    else { itemId = (await addDoc(collection(db, "items"), { ...data, createdAt: serverTimestamp() })).id; }
    const link = $("plink").value.trim();
    if (link) await setDoc(doc(db, "itemLinks", itemId), { link });
    else await deleteDoc(doc(db, "itemLinks", itemId)).catch(() => {});
    if (!editing && ["CORE", "PRIME"].includes(data.catalogue)) await setDoc(doc(db, "catalogueMeta", data.catalogue), { lastAddedAt: serverTimestamp() });
    const known = new Set(items.flatMap(i => i.categories || []));
    const fresh = categories.filter(c => !known.has(c));
    if (hiddenCats.some(c => fresh.includes(c))) { hiddenCats = hiddenCats.filter(c => !fresh.includes(c)); await saveHidden(); }
    tab = data.catalogue; reset(); await load(); msg.textContent = "Saved.";
  } catch (e) { msg.textContent = e.message; }
  $("save").disabled = false;
};

$("refO").onclick = () => loadExtra();
let curSec = "items", unseen = { orders: [], forms: [] }, newIds = new Set();
function updateDots(){ ["orders", "forms"].forEach(k => $("dot-" + k).classList.toggle("hidden", !unseen[k].length || curSec === k)); }
function markSeen(k){ unseen[k].splice(0).forEach(id => setDoc(doc(db, k, id), { seen: true }, { merge: true }).catch(() => {})); updateDots(); }
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  curSec = b.dataset.s;
  document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x === b));
  ["items", "chats", "orders", "forms", "of"].forEach(n => $("sec-" + n).classList.toggle("hidden", n !== curSec));
  if (curSec === "orders" || curSec === "forms") markSeen(curSec);
});
async function loadExtra(){
  const [o, f, l] = await Promise.all([
    getDocs(query(collection(db, "orders"), orderBy("createdAt", "desc"))),
    getDocs(query(collection(db, "forms"), orderBy("createdAt", "desc"))),
    getDocs(collection(db, "itemLinks"))
  ]);
  const links = {}; l.docs.forEach(d => links[d.id] = d.data().link);
  unseen.orders = o.docs.filter(d => !d.data().seen).map(d => d.id); unseen.orders.forEach(id => newIds.add(id));
  unseen.forms = f.docs.filter(d => !d.data().seen).map(d => d.id); unseen.forms.forEach(id => newIds.add(id));
  if (curSec === "orders") markSeen("orders");
  if (curSec === "forms") markSeen("forms");
  updateDots();
  $("orders").innerHTML = o.empty ? '<div class="meta">No orders yet.</div>' : "";
  o.docs.forEach(d => {
    const x = d.data(), el = document.createElement("div"); el.className = "item"; el.style.display = "block";
    el.innerHTML = `<div>${newIds.has(d.id) ? '<span class="dot">● NEW </span>' : ""}<strong>@${esc(x.username)}</strong> · ${esc(x.name)} · ${esc(x.email)}</div>
      <div class="meta">${(x.items || []).map(i => esc(i.catalogue) + ": " + esc((i.caption || "Item").slice(0, 30)) + " (" + esc(i.size) + ", " + esc(i.price) + ")" + (/^https?:\/\//i.test(links[i.id] || "") ? ` · <a href="${esc(links[i.id])}" target="_blank" rel="noopener">Open link</a>` : "")).join("<br>")}</div>
      <div class="meta">Total ${esc(x.totalGb)} GB · ${esc(x.totalPrice)} · ${x.delivery === "telegram" ? "TELEGRAM delivery" : esc(x.deviceType) + " " + esc(x.deviceSize) + " GB (" + (x.newDevice ? "new device" : "previous device") + ")"}</div>
      <div class="meta">Status: <strong>${esc(x.status)}</strong></div>`;
    if (x.status === "pending") {
      const b = document.createElement("button"); b.textContent = "Accept";
      b.onclick = async () => { await setDoc(doc(db, "orders", d.id), { status: "accepted" }, { merge: true }); loadExtra(); };
      el.appendChild(b);
    }
    if (x.status !== "delivered") {
      const b = document.createElement("button"); b.className = "p"; b.style.width = "auto"; b.style.marginLeft = "8px"; b.textContent = "Mark delivered";
      b.onclick = async () => {
        if (!confirm("Mark this order as delivered?")) return;
        await setDoc(doc(db, "orders", d.id), { status: "delivered" }, { merge: true });
        await setDoc(doc(db, "users", x.uid), { status: "delivered" }, { merge: true });
        loadExtra();
      };
      el.appendChild(b);
    }
    const del = document.createElement("button"); del.className = "d"; del.style.marginLeft = "8px"; del.textContent = "Delete";
    del.onclick = async () => {
      if (!confirm("Delete this order?" + (x.status !== "delivered" ? " The user will be unlocked and can order again." : ""))) return;
      await deleteDoc(doc(db, "orders", d.id));
      if (x.status !== "delivered") await setDoc(doc(db, "users", x.uid), { status: "none" }, { merge: true });
      loadExtra();
    };
    el.appendChild(del);
    $("orders").appendChild(el);
  });
  $("forms").innerHTML = f.empty ? '<div class="meta">No forms yet.</div>' : "";
  f.docs.forEach(d => {
    const x = d.data(), el = document.createElement("div"); el.className = "item"; el.style.display = "block";
    el.innerHTML = `<div>${newIds.has(d.id) ? '<span class="dot">● NEW </span>' : ""}<strong>@${esc(x.username)}</strong></div>` + Object.values(x.answers || {}).filter(a => a.label !== "Confirmed accuracy").map(a => `<div class="meta">${esc(a.label)}: ${esc(a.value)}</div>`).join("");
    const del = document.createElement("button"); del.className = "d"; del.textContent = "Delete";
    del.onclick = async () => { if (!confirm("Delete this form?")) return; await deleteDoc(doc(db, "forms", d.id)); loadExtra(); };
    el.appendChild(del);
    $("forms").appendChild(el);
  });
}

let openUid = null, unsubT = null;
function startChats(){
  onSnapshot(query(collection(db, "chats"), orderBy("lastAt", "desc")), snap => {
    $("chatList").innerHTML = snap.empty ? '<div class="meta">No chats yet.</div>' : "";
    $("dot-chats").classList.toggle("hidden", !snap.docs.some(d => d.data().adminUnread ?? d.data().lastFrom === "user"));
    snap.docs.forEach(d => {
      const x = d.data(), b = document.createElement("button");
      b.style.cssText = "display:block;width:100%;text-align:left";
      b.textContent = ((x.adminUnread ?? x.lastFrom === "user") ? "● " : "") + "@" + (x.username || "user");
      b.onclick = () => openChat(d.id, x.username);
      $("chatList").appendChild(b);
    });
  });
}
function openChat(uid, name){
  openUid = uid; setDoc(doc(db, "chats", uid), { adminUnread: false }, { merge: true }).catch(() => {}); $("chatList").classList.add("hidden"); $("chatThread").classList.remove("hidden");
  $("chatWho").textContent = "@" + (name || "user");
  if (unsubT) unsubT();
  unsubT = onSnapshot(query(collection(db, "chats", uid, "messages"), orderBy("createdAt")), snap => {
    const box = $("chatMsgs"); box.innerHTML = "";
    snap.docs.forEach(d => { const x = d.data(), b = document.createElement("div"); b.className = "b" + (x.from === "admin" ? " me" : ""); b.textContent = x.text; box.appendChild(b); });
    box.scrollTop = box.scrollHeight;
    const last = snap.docs[snap.docs.length - 1];
    if (last && last.data().from === "user") setDoc(doc(db, "chats", uid), { adminUnread: false }, { merge: true }).catch(() => {});
  });
}
$("chatBack").onclick = () => { if (unsubT) unsubT(); unsubT = null; openUid = null; $("chatThread").classList.add("hidden"); $("chatList").classList.remove("hidden"); };
$("chatSend").onclick = async () => {
  const t = $("chatIn").value.trim(); if (!t || !openUid) return;
  $("chatIn").value = "";
  try {
    await addDoc(collection(db, "chats", openUid, "messages"), { from: "admin", text: t.slice(0, 1000), createdAt: serverTimestamp() });
    await setDoc(doc(db, "chats", openUid), { lastAt: serverTimestamp(), lastFrom: "admin", userUnread: true }, { merge: true });
  } catch (e) { $("chatIn").value = t; }
};
$("chatDel").onclick = async () => {
  if (!openUid || !confirm("Delete this whole chat?")) return;
  const uid = openUid; $("chatBack").click();
  const ms = await getDocs(collection(db, "chats", uid, "messages"));
  await Promise.all(ms.docs.map(m => deleteDoc(m.ref)));
  await deleteDoc(doc(db, "chats", uid));
};
$("chatIn").onkeydown = e => { if (e.key === "Enter") $("chatSend").click(); };
async function loadOF(){
  try {
    const d = await getDoc(doc(db, "pages", "of")), x = d.exists() ? d.data() : {};
    $("ofText").value = x.text || ""; $("ofUnlockLabel").value = x.unlockLabel || "Unlock OF";
    $("ofUnlockUrl").value = x.unlockUrl || "https://t.me/+GM3Oh7_LHI0zOTdl"; $("ofSupportLabel").value = x.supportLabel || "Support";
  } catch (e) {}
}
$("ofSave").onclick = async () => {
  try {
    await setDoc(doc(db, "pages", "of"), { text: $("ofText").value, unlockLabel: $("ofUnlockLabel").value.trim(), unlockUrl: $("ofUnlockUrl").value.trim(), supportLabel: $("ofSupportLabel").value.trim() });
    $("ofMsg").textContent = "Saved.";
  } catch (e) { $("ofMsg").textContent = "Could not save."; }
};
</script>
</body>
</html>
